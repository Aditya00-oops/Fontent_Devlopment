<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>
<body>

    <h2>Student Registration Form</h2>

    <form>
        Roll no. : <input type="text" name="rollno"><br><br>
        
        Student name : 
        <input type="text" name="firstname" placeholder="First Name"> - 
        <input type="text" name="lastname" placeholder="Last Name"><br><br>
        
        Father's name : <input type="text" name="fathername"><br><br>
        
        Date of birth : 
        <input type="text" name="day" placeholder="Day" size="4"> - 
        <input type="text" name="month" placeholder="Month" size="6"> - 
        <input type="text" name="year" placeholder="Year" size="6"> (DD-MM-YYYY)<br><br>
        
        Mobile no. : <input type="text" value="+91" size="3" readonly> - <input type="tel" name="mobile"><br><br>
        
        Email id : <input type="email" name="email"><br><br>
        
        Password : <input type="password" name="password"><br><br>
        
        Gender : 
        <input type="radio" name="gender" value="Male"> Male 
        <input type="radio" name="gender" value="Female"> Female<br><br>
        
        Department : 
        <input type="checkbox" name="dept" value="CSE"> CSE 
        <input type="checkbox" name="dept" value="IT"> IT 
        <input type="checkbox" name="dept" value="ECE"> ECE 
        <input type="checkbox" name="dept" value="Civil"> Civil 
        <input type="checkbox" name="dept" value="Mech"> Mech<br><br>
        
        Course : 
        <select name="course">
            <option>-- Select Current Course's --</option>
            <option value="btech">B.Tech</option>
            <option value="mtech">M.Tech</option>
            <option value="bca">BCA</option>
            <option value="mca">MCA</option>
        </select><br><br>
        
        Student photo : <input type="file" name="photo"><br><br>
        
        City : <input type="text" name="city"><br><br>
        
        Address : <textarea name="address" rows="4" cols="30"></textarea><br><br>
        
        <input type="submit" value="Register">
    </form>

</body>
</htm>
