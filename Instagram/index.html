<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Instagram</title>
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <!-- Login Card -->
        <div class="login-box">
            <div class="logo">Instagram</div>
            <form>
                <input type="text" name="username" placeholder="Phone number, username, or email">
                <input type="password" name="password" placeholder="Password">
                <button type="submit" class="login-btn">Log In</button>
            </form>
            
            <div class="or-divider">OR</div>
            
            <a href="#" class="fb-login">
                <svg class="fb-icon" viewBox="0 0 24 24" fill="#385185">
                    <path d="M12 2.04c-5.5 0-10 4.5-10 10 0 5 3.66 9.13 8.44 9.88v-6.99h-2.54v-2.89h2.54v-2.2c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.23.19 2.23.19v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.77l-.44 2.89h-2.33v6.99c4.78-.75 8.44-4.88 8.44-9.88 0-5.5-4.5-10-10-10z"/>
                </svg>
                Log in with Facebook
            </a>
            
            <a href="#" class="forgot-pw">Forgot password?</a>
        </div>

        <!-- Sign Up Card -->
        <div class="signup-box">
            Don't have an account? <a href="#">Sign up</a>
        </div>
    </div>

</body>
</html>
